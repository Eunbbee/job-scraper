<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link
  rel="stylesheet"
  href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css"
    >

     <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gaegu&family=Noto+Sans+KR:wght@400;600&display=swap" rel="stylesheet">
    
    <title>Job Scraper | Results</title>

    <style>
      body {
      background: linear-gradient(135deg, #fceabb, #f8b6d2);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 4rem 1rem;
      font-family: "Noto Sans KR", sans-serif;
    }

    main.container {
      background: rgba(255, 255, 255, 0.92);
      padding: 3rem 2.5rem;
      border-radius: 1.5rem;
      box-shadow: 0 12px 30px rgba(84, 81, 81, 0.15);
      max-width: 1100px;
      width: 100%;
    }

    /* 짝수 행 */
    table.striped > tbody > tr:nth-child(even) {
    background-color: #fff7fb !important;
    }

    table.striped > tbody > tr:nth-child(odd) {
    background-color: #ffffff !important;
    }

    hgroup {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    hgroup h1 {
      font-family: "Gaegu", cursive;
      margin-bottom: 0.75rem;
      color: #666;
    }

    hgroup a {
      display: inline-block;
      margin-top: 0.5rem;
      padding: 0.4rem 1.2rem;
      border-radius: 999px;
      background-color: #ff9acb;
      color: white;
      text-decoration: none;
      font-size: 0.9rem;
    }

    hgroup a:hover {
      background-color: #ff7fb8;
    }

    figure {
      overflow-x: auto;
    }

    table {
      text-align: center;
    }

    thead th {
      background-color: #fef0f6ff;
      color: #918888ff;
    }

    tbody tr:hover {
      background-color: #fff3f8;
    }

    td a {
      color: #ff6fae;
      background-color: #c39f9f6b;
      font-weight: 600;
      text-decoration: none;
    }
    thead th {
    font-size: 0.85rem;
    }

    tbody td {
    font-size: 0.55rem;
    }

    td a:hover {
      text-decoration: underline;
    }
    table.striped {
    --pico-table-row-stripped-background-color: #fff7fb;
    }

    </style>

</head>
<body>
    <main class="container">
        <hgroup>
            <h1>Search Results for "{{keyword}}"</h1>
            <a target="_blank" href="/export?keyword={{keyword}}">Export to file</a>
        </hgroup>
        <figure>
            <table class="striped">
                <thead>
                    <tr>
                        <th>Type</th>
                        <th>Title</th>
                        <th>Company</th>
                        <th>Location</th>
                        <th>Apply Link</th>
                        <!-- <th>Link</th> -->
                    </tr>
                </thead>
                <tbody>
                {% for job in jobs %}
                    <tr>
                        <td>{{job.type}}</td>
                        <td>{{job.title}}</td>
                        <td>{{job.company_name}}</td>
                        <td>{{job.location}}</td>
                        <!-- <td>{{job.link}}</td> -->
                        <td><a href="{{job.link}}" target="_blank">Link &rarr;</a></td>
                    </tr>
                {% endfor %}
                </tbody>
            </table>
        </figure>
        </form>
    </main>
</body>
</html>
